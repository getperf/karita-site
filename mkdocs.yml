site_name: karita
site_url: https://karita.getperf.net

theme:
  name: material
  language: ja
  logo: img/karita_icon.png
  favicon: img/karita_icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.footer
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - ブラウザー拡張の入れ方: extensions/index.md
  - プライバシーポリシー: privacy.md
  - 利用規約: terms.md

# The link-check page is reached from the karita app and the guide only.
not_in_nav: |
  /extensions/check.md

# Internal planning documents are not published.
exclude_docs: |
  /plans/
