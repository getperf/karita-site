site_name: karita
site_url: https://karita.getperf.net

theme:
  name: material
  language: ja
  logo: img/karita_icon.png
  favicon: img/karita_icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.footer
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - Android版クローズドテスト: closed-test.md
  - 使い方:
      - セットアップ:
          - Windows:
              - インストール・初期設定: guide/windows/setup.md
              - ブラウザーとつなぐ: extensions/index.md
              - 図書館を登録する: guide/windows/libraries.md
          - Android: guide/android/setup.md
          - iPhone: guide/ios/add-device.md
      - 日常の使い方:
          - 本を探す・予約して記録する: guide/windows/reservation.md
          - 貸出し・返却を記録する: guide/loans.md
          - 本棚・レビューを使う: guide/bookshelf.md
          - スマートフォンでの操作: guide/smartphone.md
      - 設定・同期・バックアップ:
          - 設定を変更する: guide/settings.md
          - 同期・バックアップ・復元: guide/data.md
      - 困ったとき: guide/troubleshooting.md
  - プライバシーポリシー: privacy.md
  - 利用規約: terms.md

# The link-check page is reached from the karita app and the guide only.
not_in_nav: |
  /extensions/check.md
  /guide/android/second-device.md
  /guide/android/reservation.md

# Internal planning documents are not published.
exclude_docs: |
  /plans/
