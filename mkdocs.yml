site_name: karita
site_url: https://karita.getperf.net

theme:
  name: material
  language: ja
  logo: img/karita_icon.png
  favicon: img/karita_icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.footer
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  # Temporary: remove this entry and closed-test.md after the closed test.
  - Android版クローズドテスト: closed-test.md
  - 使い方:
      - ガイドの入口: guide/index.md
      - Windows のセットアップ:
          - 1〜3. インストール・初期設定: guide/windows/setup.md
          - 4. ブラウザーとつなぐ: extensions/index.md
          - 5. 図書館を登録する: guide/windows/libraries.md
      - 図書を予約する: guide/windows/reservation.md
      - 貸出しの棚卸をする: guide/loans.md
      - 本棚・レビューを使う: guide/bookshelf.md
      - 設定を変更する: guide/settings.md
      - 同期・バックアップ・復元: guide/data.md
      - Android を2台目として追加する: guide/android/second-device.md
      - 図書を予約する（Android）: guide/android/reservation.md
      - 困ったとき: guide/troubleshooting.md
  - プライバシーポリシー: privacy.md
  - 利用規約: terms.md

# The link-check page is reached from the karita app and the guide only.
not_in_nav: |
  /extensions/check.md

# Internal planning documents are not published.
exclude_docs: |
  /plans/
